name: Supply Chain Review
description: Detect patterns associated with Human-in-the-Loop supply chain attacks

branding:
  icon: check-circle
  color: blue

inputs:
  rules-file:
    description: Optional custom YAML rules file in the caller repository
    required: false
    default: ""

  rules-mode:
    description: "How to handle custom rules. Options: merge, replace"
    required: false
    default: merge

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --user pyyaml

    - name: Run supply chain review
      shell: bash
      env:
        RULES_FILE: ${{ inputs.rules-file }}
        RULES_MODE: ${{ inputs.rules-mode }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/src/scan.py"